name: BE200 Tahoe build

on:
  push:
    branches: [be200-tahoe]
    paths:
      - 'itlwm/**'
      - 'itl80211/**'
      - 'AirportItlwm/**'
      - 'include/**'
      - 'itlwm.xcodeproj/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        required: true
        default: Debug
        options: [Debug, Release]

permissions:
  contents: read

concurrency:
  group: be200-tahoe-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Expose public Tahoe MSI-X API
        run: python3 scripts/prepare_tahoe_sdk.py
      - name: Check real firmware section storage
        run: python3 scripts/check_firmware_sections.py
      - name: Check PNVM resource names
        run: python3 scripts/check_pnvm_names.py
      - name: Check BE family firmware selection and command ABI
        run: |
          python3 scripts/check_be_firmware.py
          python3 tests/host/gl92/gl92_host_test.py
      - name: Check PNVM completion semantics
        run: python3 scripts/check_pnvm_completion.py
      - name: Check NVM MAC CSR handling
        run: python3 scripts/check_nvm_mac.py
      - name: Check MCC response ABI handling
        run: python3 scripts/check_mcc_response.py
      - name: Check 6 GHz HE state, MBSSID links and country policy
        run: python3 scripts/check_6ghz_state.py
      - name: Check startup power diagnostics
        run: python3 scripts/check_startup_power.py
      - name: Check WCL channel and authentication behavior
        run: |
          python3 scripts/check_beacon_event.py
          c++ -std=c++14 -Wall -Wextra -Wno-unused-parameter -Werror tests/wcl_channels.cpp -o "$RUNNER_TEMP/wcl_channels"
          "$RUNNER_TEMP/wcl_channels"
          c++ -std=c++14 -Wall -Wextra -Wno-unused-parameter -Werror tests/wcl_mbssid.cpp -o "$RUNNER_TEMP/wcl_mbssid"
          "$RUNNER_TEMP/wcl_mbssid"
          bash -n scripts/Collect-WiFi-Community.command
      - name: Check 6 GHz basic rates and mode transitions
        run: python3 tests/host/scan/scan_host_test.py
      - name: Check scan lifecycle and TX/RX recovery
        run: |
          python3 tests/host/scan/boot_join_host_test.py
          python3 tests/host/scan/beacon_edca_host_test.py
          python3 tests/host/scan/scan_v17_host_test.py
          python3 tests/host/scan/wcl_scan_host_test.py
          python3 tests/host/tx/tx_drain_host_test.py
          python3 tests/host/tx/tx_recovery_host_test.py
          python3 tests/host/mlo/mlo_rx_host_test.py
      - name: Run host-side SAE tests
        run: |
          sh tests/host/sae/run.sh
          SAE_HNP_COMPAT=1 sh tests/host/sae/run.sh
      - name: Build Tahoe and Sequoia x86_64 kexts
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
        run: |
          set -euo pipefail
          mkdir -p logs artifacts
          xcodebuild -version > logs/toolchain.txt
          git rev-parse HEAD > logs/source-commit.txt
          for platform in Tahoe Sequoia; do
            xcodebuild -project itlwm.xcodeproj -target "AirportItlwm-$platform" \
              -configuration "$CONFIGURATION" -jobs 3 ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
              SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
              CODE_SIGNING_ALLOWED=NO \
              build > "logs/build-$platform.txt" 2>&1 || {
                grep -n -A3 -B2 'error:' "logs/build-$platform.txt" || true
                tail -30 "logs/build-$platform.txt"
                exit 1
              }
            product="$PWD/build/products/$CONFIGURATION/$platform/AirportItlwm.kext"
            dwarfdump --uuid "$product/Contents/MacOS/AirportItlwm" > "artifacts/UUID-$platform.txt"
            ditto -c -k --keepParent "$product" "artifacts/AirportItlwm-$platform.zip"
          done
          cp logs/source-commit.txt artifacts/
          cp LICENSE iwlwifi-firmware-license BE200.md artifacts/
      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: logs/
          retention-days: 7
      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Tahoe-Sequoia-${{ inputs.configuration || 'Debug' }}-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
